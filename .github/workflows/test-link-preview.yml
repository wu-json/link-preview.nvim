name: Test link previews

on:
  pull_request:
    paths:
      - 'lua/**'
      - 'tests/**'
      - '.github/workflows/test-link-preview.yml'
      - '.github/scripts/setup-link-preview-tests.sh'
      - '.github/scripts/setup-neovim-tests.sh'
  push:
    branches: [main]
    paths:
      - 'lua/**'
      - 'tests/**'
      - '.github/workflows/test-link-preview.yml'
      - '.github/scripts/setup-link-preview-tests.sh'
      - '.github/scripts/setup-neovim-tests.sh'

permissions:
  contents: read

concurrency:
  group: link-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: |
          bash .github/scripts/setup-link-preview-tests.sh "$RUNNER_TEMP/link-preview"
          echo "$RUNNER_TEMP/link-preview/nvim/bin" >> "$GITHUB_PATH"
      - name: Run offline Lua tests
        run: |
          nvim --headless -u NONE -l tests/run.lua
          SNACKS_TEST_DIR="$RUNNER_TEMP/link-preview/snacks.nvim" nvim --headless -u NONE -l tests/retry.lua
          SNACKS_TEST_DIR="$RUNNER_TEMP/link-preview/snacks.nvim" nvim --headless -u NONE -l tests/placement.lua
